    {name = "grupo pi 17", email = ""},
]
dependencies = ["pandas>=3.0.1", "numpy>=2.4.3", "matplotlib>=3.10.8", "jupyter>=1.1.1", "psycopg2-binary>=2.9.11", "python-dotenv>=1.2.2", "ipykernel>=7.2.0", "tdqm>=0.0.1", "plotly>=6.7.0", "pyarrow>=23.0.1", "sqlalchemy>=2.0.49"]
